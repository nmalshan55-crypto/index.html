<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie & TV Show Database</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #141414; color: #fff; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #e50914; margin-bottom: 15px; }
        input { padding: 12px 20px; width: 60%; max-width: 400px; border-radius: 20px; border: none; font-size: 16px; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #1f1f1f; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; height: 300px; object-fit: cover; }
        .card-info { padding: 15px; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-year { font-size: 14px; color: #aaa; }
        /* Modal Popup */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 20px; z-index: 1000; }
        .modal-content { background: #222; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; border-radius: 12px; padding: 20px; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 25px; cursor: pointer; color: #fff; }
        .modal-header { display: flex; gap: 20px; flex-wrap: wrap; }
        .modal-header img { width: 150px; border-radius: 8px; }
        .modal-details { flex: 1; }
        .modal-details h2 { color: #e50914; margin-bottom: 10px; }
        .modal-details p { margin-bottom: 8px; color: #ddd; font-size: 14px; }
        iframe { width: 100%; height: 315px; border: none; margin-top: 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <header>
        <h1>🍿 Movie & TV Database</h1>
        <input type="text" id="searchInput" placeholder="Search Movie or TV Show..." onkeyup="searchMedia()">
    </header>

    <div class="grid" id="movieGrid"></div>

    <!-- Details Modal -->
    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const API_KEY = 'd07f88909b5554235591a31a6133654e'; // API Key එක ඇතුළත් කර ඇත
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';

        // Load Popular Movies on Start
        async function getPopularMovies() {
            const res = await fetch(`${BASE_URL}/movie/popular?api_key=${API_KEY}`);
            const data = await res.json();
            displayMovies(data.results);
        }

        function displayMovies(movies) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            movies.forEach(movie => {
                const title = movie.title || movie.name;
                const year = (movie.release_date || movie.first_air_date || '').split('-')[0];
                const poster = movie.poster_path ? IMG_URL + movie.poster_path : 'https://via.placeholder.com/500x750';
                
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => showDetails(movie.id, movie.media_type || 'movie');
                card.innerHTML = `
                    <img src="${poster}" alt="${title}">
                    <div class="card-info">
                        <div class="card-title">${title}</div>
                        <div class="card-year">📅 ${year || 'N/A'}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function searchMedia() {
            const query = document.getElementById('searchInput').value;
            if(!query) return getPopularMovies();
            const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${query}`);
            const data = await res.json();
            displayMovies(data.results);
        }

        async function showDetails(id, type) {
            const res = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&append_to_response=credits,videos`);
            const data = await res.json();

            const title = data.title || data.name;
            const year = (data.release_date || data.first_air_date || '').split('-')[0];
            const overview = data.overview || 'No description available.';
            const cast = data.credits.cast.slice(0, 5).map(c => c.name).join(', ');
            const trailer = data.videos.results.find(v => v.type === 'Trailer');
            const poster = data.poster_path ? IMG_URL + data.poster_path : '';

            let trailerHTML = trailer ? `<iframe src="https://www.youtube.com/embed/${trailer.key}" allowfullscreen></iframe>` : '<p style="margin-top:15px; color:#aaa;">No Trailer Available</p>';

            document.getElementById('modalBody').innerHTML = `
                <div class="modal-header">
                    <img src="${poster}" alt="${title}">
                    <div class="modal-details">
                        <h2>${title} (${year})</h2>
                        <p><strong>⭐ Rating:</strong> ${data.vote_average.toFixed(1)} / 10</p>
                        <p><strong>🎭 Cast:</strong> ${cast}</p>
                        <p style="margin-top:10px;"><strong>📖 Story:</strong> ${overview}</p>
                    </div>
                </div>
                ${trailerHTML}
            `;
            document.getElementById('detailsModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
            document.getElementById('modalBody').innerHTML = '';
        }

        getPopularMovies();
    </script>
</body>
</html>
